name: Build Companion App (Windows)

on:
  push:
    branches: [main]
    paths:
      - "companion/**"
      - ".github/workflows/companion-build.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion/src-tauri

      - name: Install Node dependencies
        working-directory: companion
        run: npm install

      - name: Generate icons
        working-directory: companion
        run: npx @tauri-apps/cli icon icon.png --output src-tauri/icons

      - name: Build Tauri app (x86)
        working-directory: companion
        run: npx @tauri-apps/cli build --target i686-pc-windows-msvc

      - name: List build output
        working-directory: companion
        run: |
          echo "=== NSIS ==="
          dir src-tauri\target\i686-pc-windows-msvc\release\bundle\nsis\ 2>nul || echo "(empty)"
        shell: cmd

      - name: Delete existing release (clean up old assets)
        run: gh release delete companion-latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update companion-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-latest
          name: "UrApex — latest build"
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: false
          body: |
            ## UrApex App — Windows (x86)

            > Compilado automáticamente desde `main`.

            ### Instalación
            1. Descarga el `.exe` de abajo
            2. Ejecútalo en tu PC de Windows (requiere admin para instalar en `Program Files (x86)`)
            3. En UrApex → **Settings → Companion app** → genera una API key
            4. En la app → **Settings** → pega la API key, la URL de UrApex y la ruta de resultados LMU
            5. **Start watching** — las sesiones se subirán automáticamente

            **Ruta de resultados LMU:**
            `C:\Users\<usuario>\Documents\Le Mans Ultimate\UserData\player\Results\`
          files: |
            companion/src-tauri/target/i686-pc-windows-msvc/release/bundle/nsis/*.exe
