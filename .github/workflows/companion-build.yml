name: Build Companion App (Windows)

on:
  push:
    branches: [main]
    paths:
      - "companion/**"
      - ".github/workflows/companion-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion/src-tauri

      - name: Install Node dependencies
        working-directory: companion
        run: npm ci

      - name: Generate icons
        working-directory: companion
        run: npx @tauri-apps/cli@latest icon icon.png --output src-tauri/icons

      - name: Build Tauri app
        working-directory: companion
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Update "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-latest
          name: "UrApex Companion — latest build"
          prerelease: true
          body: |
            ## UrApex Companion App — Windows

            > Built automatically from `main` on ${{ github.event.head_commit.message }}

            ### Instalación
            1. Descarga el `.exe` (instalador) o el `.msi`
            2. Ejecuta el instalador en tu PC de Windows
            3. En UrApex → **Settings → Companion app** → genera una API key
            4. En la app → **Settings** → pega la API key, la URL de UrApex y la ruta a tu carpeta de resultados de LMU
            5. **Start watching** — las sesiones se subirán automáticamente

            **Ruta de resultados LMU:**
            `C:\Users\<tu usuario>\Documents\Le Mans Ultimate\UserData\player\Results\`
          files: |
            companion/src-tauri/target/release/bundle/nsis/*.exe
            companion/src-tauri/target/release/bundle/msi/*.msi
