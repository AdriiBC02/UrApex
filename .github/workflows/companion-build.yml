name: Build Companion App (Windows)

on:
  push:
    branches: [main]
    paths:
      - "companion/**"
      - ".github/workflows/companion-build.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion/src-tauri

      - name: Install Node dependencies
        working-directory: companion
        run: npm install

      - name: Generate icons
        working-directory: companion
        run: npx @tauri-apps/cli icon icon.png --output src-tauri/icons

      - name: Build Tauri app (x86)
        working-directory: companion
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx @tauri-apps/cli build --target i686-pc-windows-msvc

      - name: List build output
        working-directory: companion
        shell: cmd
        run: |
          echo === NSIS ===
          dir src-tauri\target\i686-pc-windows-msvc\release\bundle\nsis\ 2>nul || echo (empty)

      - name: Read version
        id: ver
        working-directory: companion
        shell: pwsh
        run: |
          $conf    = Get-Content "src-tauri\tauri.conf.json" | ConvertFrom-Json
          $version = $conf.version
          echo "VERSION=$version" | Out-File -Append $env:GITHUB_OUTPUT
          echo "TAG=companion/v$version" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Generate latest.json for auto-updater
        working-directory: companion
        shell: pwsh
        run: |
          $bundleDir = "src-tauri\target\i686-pc-windows-msvc\release\bundle\nsis"
          $version   = "${{ steps.ver.outputs.VERSION }}"

          $exeFile = Get-ChildItem $bundleDir -Filter "*.exe" | Select-Object -First 1
          $sigFile = Get-ChildItem $bundleDir -Filter "*.sig"  | Select-Object -First 1

          if (-not $sigFile) {
            Write-Warning "No .sig file — TAURI_SIGNING_PRIVATE_KEY not set. Skipping latest.json."
            exit 0
          }

          $signature   = (Get-Content $sigFile.FullName -Raw).Trim()
          $date        = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          $downloadUrl = "https://github.com/AdriiBC02/UrApex/releases/download/companion-latest/$($exeFile.Name)"

          $manifest = [ordered]@{
            version  = $version
            notes    = "See https://github.com/AdriiBC02/UrApex/releases/tag/companion-latest for details."
            pub_date = $date
            platforms = [ordered]@{
              "windows-i686" = [ordered]@{
                signature = $signature
                url       = $downloadUrl
              }
            }
          } | ConvertTo-Json -Depth 5

          $manifest | Out-File -FilePath "latest.json" -Encoding UTF8NoBOM
          Write-Host "Generated latest.json for v$version"

      - name: Write release body
        shell: pwsh
        run: |
          $body = @'
          ## UrApex Companion — Windows (x86)

          Compilado automáticamente desde `main`.

          ### Instalación
          1. Descarga el `.exe` de abajo
          2. Ejecútalo en Windows (requiere admin — instala en `Program Files (x86)`)
          3. En UrApex → **Settings → Companion app** → genera una API key
          4. En la app → **Settings** → pega la API key, la URL de UrApex y la ruta de resultados LMU
          5. **Start watching** — las sesiones se subirán automáticamente

          **Ruta de resultados LMU:**
          `C:\Users\<usuario>\Documents\Le Mans Ultimate\UserData\player\Results\`
          '@
          $body | Out-File -FilePath "release-body.md" -Encoding UTF8NoBOM

      - name: Delete existing companion-latest release
        run: gh release delete companion-latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Always-current — used by auto-updater (overwrites on every build)
      - name: Upload to companion-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-latest
          name: "UrApex Companion — latest build"
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: false
          body_path: release-body.md
          files: |
            companion/src-tauri/target/i686-pc-windows-msvc/release/bundle/nsis/*.exe
            companion/latest.json

      # Versioned — permanent, for rollbacks (skips if tag already exists)
      - name: Create versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: "UrApex Companion v${{ steps.ver.outputs.VERSION }}"
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: false
          body_path: release-body.md
          files: |
            companion/src-tauri/target/i686-pc-windows-msvc/release/bundle/nsis/*.exe
